[project]
name = "aeropass"
version = "0.1.0"
description = "AeroPass backend: registro, verificación biométrica, identidad digital y QR dinámico"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "upstash-redis>=1.1",
    "upstash-ratelimit>=1.1",
    "qstash>=2.0",
    "clerk-backend-api>=1.0",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "uuid-utils>=0.9",
    "vercel>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "uvicorn>=0.30",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeropass"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI Depends() en valores por defecto

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires a real Postgres (TEST_DATABASE_URL)"]

[tool.mypy]
python_version = "3.11"
packages = ["aeropass"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
