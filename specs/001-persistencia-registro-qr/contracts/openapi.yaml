openapi: 3.1.0
info:
  title: AeroPass Backend — Registration, biometrics and passes
  version: 1.0.0
  description: >
    Endpoints of feature 001-persistencia-registro-qr. Every /v1 route requires a Clerk
    session token in `Authorization: Bearer <token>` and only operates on the passenger of the
    authenticated account (FR-022). Errors use the `Error` format.
servers:
  - url: https://{deployment}.vercel.app
    variables:
      deployment:
        default: aeropass-backend

security:
  - clerkSession: []

paths:
  /v1/identity:
    post:
      operationId: registrarDocumento
      summary: Registers the data read from the document and the face photo from the document (Story 1)
      description: >
        The photo is stored in the private media store (FR-001a) and is the reference for the
        biometric comparison. On an identical resubmission from the same account (200) the new
        photo is ignored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RegistroDocumentoRequest' }
            encoding:
              foto_documento:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Passenger created in PENDIENTE_VERIFICACION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pasajero' }
        '200':
          description: Resubmission from the same account; the existing passenger is returned without duplicating it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pasajero' }
        '409':
          description: >
            Document already registered by another account (`DOCUMENTO_YA_REGISTRADO`) or the
            account already registered a different document (`CUENTA_YA_REGISTRADA`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Photo larger than 4 MB (`IMAGEN_DEMASIADO_GRANDE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Unsupported photo format (`FORMATO_NO_ADMITIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Missing or invalid fields (`DATOS_INVALIDOS`) or expired document (`DOCUMENTO_VENCIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The photo could not be stored; the passenger was not persisted (`ALMACENAMIENTO_NO_DISPONIBLE`)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /v1/identity/me:
    get:
      operationId: obtenerMiPasajero
      summary: Current status of the authenticated passenger
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pasajero' }
          description: OK
        '404':
          description: The account has not registered its document yet (`PASAJERO_NO_REGISTRADO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /v1/biometrics/verifications:
    post:
      operationId: verificarSelfie
      summary: Uploads a selfie and evaluates liveness + face match (Stories 2 and 3)
      description: >
        The image is stored in a private store; only its reference is persisted. If the
        result is EXITOSO the IdentidadDigital is created and `credencial.emitida` is enqueued
        without waiting for its delivery. If the provider fails or its circuit breaker is open,
        it responds 200 with result NO_CONCLUYENTE (does not count as a failure).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [selfie]
              properties:
                selfie:
                  type: string
                  format: binary
                  description: JPEG, PNG or WebP, max 4 MB
            encoding:
              selfie:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Attempt recorded (EXITOSO, FALLIDO or NO_CONCLUYENTE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoVerificacion' }
        '404':
          description: The account has no registered passenger (`PASAJERO_NO_REGISTRADO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The passenger is already VERIFICADO or in REQUIERE_REVISION_MANUAL (`ESTADO_NO_PERMITE_VERIFICACION`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Image larger than 4 MB (`IMAGEN_DEMASIADO_GRANDE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Unsupported format (`FORMATO_NO_ADMITIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The image could not be stored; nothing was evaluated and no attempt was recorded (`ALMACENAMIENTO_NO_DISPONIBLE`)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /v1/passes:
    post:
      operationId: emitirPase
      summary: Issues (or renews) the QR CredencialAcceso for a flight (Story 4)
      description: >
        If an EMITIDA/ACTIVA credential already exists for the same passenger and flight, it is
        revoked (reason RENOVACION) in the same operation. The app must call again after
        `renovar_en_segundos` to always show a valid QR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmitirPaseRequest' }
      responses:
        '201':
          description: ACTIVA credential issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pase' }
        '403':
          description: >
            No ACTIVA IdentidadDigital (`IDENTIDAD_NO_ACTIVA`) or expired document
            (`DOCUMENTO_VENCIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Flight code with invalid format (`DATOS_INVALIDOS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: More than 30 issuances in the last minute (`LIMITE_EMISION_EXCEDIDO`)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /v1/passes/{credencialId}:
    get:
      operationId: obtenerPase
      summary: Current status and history of a credential of the authenticated passenger
      parameters:
        - name: credencialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK (applies lazy expiration before responding)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetallePase' }
        '404':
          description: Does not exist or does not belong to the passenger (`CREDENCIAL_NO_ENCONTRADA`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /.well-known/jwks.json:
    get:
      operationId: clavesPublicasQr
      summary: Ed25519 public keys to verify the QR signature (checkpoint extension point)
      security: []
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, crv, x, kid, alg, use]
                      properties:
                        kty: { const: OKP }
                        crv: { const: Ed25519 }
                        x: { type: string }
                        kid: { type: string }
                        alg: { const: EdDSA }
                        use: { const: sig }

  /internal/outbox/dispatch:
    post:
      operationId: despacharOutbox
      summary: Retries pending events and marks expired credentials (invoked by a QStash schedule)
      security:
        - qstashSignature: []
      responses:
        '200':
          description: Cycle summary
          content:
            application/json:
              schema:
                type: object
                required: [eventos_entregados, eventos_pendientes, credenciales_expiradas]
                properties:
                  eventos_entregados: { type: integer }
                  eventos_pendientes: { type: integer }
                  credenciales_expiradas: { type: integer }
        '401':
          description: Missing or invalid QStash signature

components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session token issued by Clerk
    qstashSignature:
      type: apiKey
      in: header
      name: Upstash-Signature

  responses:
    NoAutenticado:
      description: Missing, invalid or expired token (`NO_AUTENTICADO`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          enum:
            - NO_AUTENTICADO
            - DATOS_INVALIDOS
            - DOCUMENTO_VENCIDO
            - DOCUMENTO_YA_REGISTRADO
            - CUENTA_YA_REGISTRADA
            - PASAJERO_NO_REGISTRADO
            - ESTADO_NO_PERMITE_VERIFICACION
            - IMAGEN_DEMASIADO_GRANDE
            - FORMATO_NO_ADMITIDO
            - ALMACENAMIENTO_NO_DISPONIBLE
            - IDENTIDAD_NO_ACTIVA
            - LIMITE_EMISION_EXCEDIDO
            - CREDENCIAL_NO_ENCONTRADA
        mensaje: { type: string }
        detalles:
          type: object
          additionalProperties: true
          description: e.g. list of missing fields

    RegistroDocumentoRequest:
      type: object
      required: [nombre_completo, tipo_documento, numero_documento, fecha_vencimiento, foto_documento]
      properties:
        nombre_completo: { type: string, minLength: 2, maxLength: 200 }
        tipo_documento: { type: string, enum: [CC, CE, PASAPORTE] }
        numero_documento: { type: string, minLength: 4, maxLength: 20 }
        fecha_vencimiento: { type: string, format: date }
        foto_documento:
          type: string
          format: binary
          description: Face cropped from the document; JPEG, PNG or WebP, max 4 MB

    Pasajero:
      type: object
      required: [id, nombre_completo, tipo_documento, numero_documento_enmascarado, fecha_vencimiento, estado, intentos_fallidos]
      properties:
        id: { type: string, format: uuid }
        nombre_completo: { type: string }
        tipo_documento: { type: string, enum: [CC, CE, PASAPORTE] }
        numero_documento_enmascarado:
          type: string
          description: Only the last 4 digits visible, e.g. "******4321"
        fecha_vencimiento: { type: string, format: date }
        estado: { type: string, enum: [PENDIENTE_VERIFICACION, VERIFICADO, REQUIERE_REVISION_MANUAL] }
        intentos_fallidos: { type: integer, minimum: 0, maximum: 3 }
        identidad_id:
          type: [string, 'null']
          format: uuid

    ResultadoVerificacion:
      type: object
      required: [intento_id, resultado, estado_pasajero, intentos_restantes]
      properties:
        intento_id: { type: string, format: uuid }
        resultado: { type: string, enum: [EXITOSO, FALLIDO, NO_CONCLUYENTE] }
        motivo_fallo:
          type: [string, 'null']
          enum: [LIVENESS, COMPARACION, null]
        score_liveness: { type: [number, 'null'], minimum: 0, maximum: 1 }
        score_comparacion: { type: [number, 'null'], minimum: 0, maximum: 1 }
        estado_pasajero: { type: string, enum: [PENDIENTE_VERIFICACION, VERIFICADO, REQUIERE_REVISION_MANUAL] }
        intentos_restantes: { type: integer, minimum: 0, maximum: 3 }
        identidad_id:
          type: [string, 'null']
          format: uuid
          description: Present only if the result is EXITOSO
        reintentar_en_segundos:
          type: [integer, 'null']
          description: Present only if the result is NO_CONCLUYENTE

    EmitirPaseRequest:
      type: object
      required: [codigo_vuelo]
      properties:
        codigo_vuelo:
          type: string
          pattern: '^[A-Z0-9]{2}[0-9]{1,4}[A-Z]?$'
          examples: [AV9380]

    Pase:
      type: object
      required: [credencial_id, token, codigo_vuelo, permisos, estado, emitida_at, expira_at, renovar_en_segundos]
      properties:
        credencial_id: { type: string, format: uuid }
        token:
          type: string
          description: Compact EdDSA JWS (claims jti, sub, flt, perms, iat, exp; header kid). QR content.
        codigo_vuelo: { type: string }
        permisos:
          type: array
          items: { type: string }
          minItems: 1
        estado: { const: ACTIVA }
        emitida_at: { type: string, format: date-time }
        expira_at: { type: string, format: date-time }
        renovar_en_segundos:
          type: integer
          description: Seconds after which the app must request renewal (QR lifetime minus 5 s)

    DetallePase:
      type: object
      required: [credencial_id, codigo_vuelo, estado, emitida_at, expira_at, historial]
      properties:
        credencial_id: { type: string, format: uuid }
        codigo_vuelo: { type: string }
        estado: { type: string, enum: [EMITIDA, ACTIVA, CONSUMIDA, EXPIRADA, REVOCADA] }
        emitida_at: { type: string, format: date-time }
        expira_at: { type: string, format: date-time }
        historial:
          type: array
          items:
            type: object
            required: [estado_solicitado, aceptada, created_at]
            properties:
              estado_anterior:
                type: [string, 'null']
              estado_solicitado: { type: string }
              aceptada: { type: boolean }
              motivo: { type: [string, 'null'] }
              created_at: { type: string, format: date-time }
